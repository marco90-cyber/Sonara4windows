name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test (Sonara.Core)
        shell: pwsh
        run: |
          dotnet test tests/Sonara.Core.Tests -c Release --filter "Category!=Live"

      - name: Prove dal vivo (YouTube Music, testi, flussi)
        continue-on-error: true
        shell: pwsh
        run: dotnet test tests/Sonara.Core.Tests -c Release --filter "Category=Live" --logger "console;verbosity=detailed"

      - name: Publish app
        shell: pwsh
        run: dotnet publish src/Sonara.App/Sonara.App.csproj -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Avvio dell'app (smoke test)
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA "Sonara"
          New-Item -ItemType Directory -Force $dir | Out-Null
          '{"WelcomeDone":true}' | Set-Content (Join-Path $dir "settings.json")
          $p = Start-Process "$PWD\publish\Sonara.exe" -PassThru
          Start-Sleep -Seconds 25
          $crash = Join-Path $dir "crash.log"
          if (Test-Path $crash) { Write-Host (Get-Content $crash -Raw); echo "CRASH" ; $bad = $true }
          if ($p.HasExited) { Write-Host "L'app e' uscita con codice $($p.ExitCode)"; $bad = $true }
          else { Write-Host "App ancora in esecuzione dopo 25 s"; Stop-Process $p -Force }
          if ($bad) { exit 1 }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = "0.1.${{ github.run_number }}"
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\publish" "/O$PWD\dist" installer\sonara.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Sonara-Setup
          path: dist/*.exe

      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.${{ github.run_number }}"
          gh release create $tag (Get-ChildItem dist\*.exe).FullName --title "Sonara per Windows $tag" --notes "Build automatica del commit ${{ github.sha }}." --target ${{ github.sha }}
